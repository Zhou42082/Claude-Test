name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  gateway:
    name: 网关测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  app:
    name: App 测试与构建（APK + 网页版）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # release 包默认使用调试签名（android/app/build.gradle.kts），可直接安装测试；正式上架前换成自己的签名
      - run: flutter build apk --release
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: smart-home-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: smart-home-web
          path: mobile/build/web
          if-no-files-found: error

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t smarthome-gateway .
      - name: 演示模式冒烟测试
        run: |
          docker run -d --name gw -p 8000:8000 -e GATEWAY_TOKEN=devtoken -e GATEWAY_ADAPTERS=mock smarthome-gateway
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
          curl -sf http://localhost:8000/ | grep -q "智能家居"
          curl -sf -H "Authorization: Bearer devtoken" http://localhost:8000/api/devices | grep -q "mock:entrance_lock"
          docker logs gw
